[package]
name = "base-benchmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "Bake-independent benchmark measurement and experiment tooling for Base projects"
repository = "https://github.com/base-rs/base-benchmark"
readme = "readme.md"
include = ["src/**", "context/**", "templates/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[workspace]
members = ["bake"]
resolver = "3"

[workspace.metadata.bake.release]
reviewers = ["base-rs/maintainers"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs", "process", "resource", "sched", "signal"] }
signal-hook = { version = "0.4.6", default-features = false, features = ["iterator"] }

[dev-dependencies]
nix = { version = "0.31.3", features = ["signal"] }
tempfile = "3.27.0"
