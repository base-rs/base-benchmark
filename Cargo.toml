[package]
name = "base-benchmark"
version = "0.3.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "Bake-independent benchmark measurement and experiment tooling for Base projects"
repository = "https://github.com/base-rs/base-benchmark"
readme = "readme.md"
include = ["src/**", "context/**", "templates/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[workspace]
members = ["bake"]
resolver = "3"

[workspace.metadata.bake.release]
reviewers = ["base-rs/maintainers"]

[features]
default = ["runner"]
# Preparation, collection, summaries, and the `base-benchmark` command. Workloads need only records and `Interval`: depend with `default-features = false`.
runner = ["dep:sha2", "dep:signal-hook", "dep:toml", "nix/feature", "nix/fs", "nix/process", "nix/sched", "nix/signal", "nix/time"]

[[bin]]
name = "base-benchmark"
path = "src/main.rs"
required-features = ["runner"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.10.9", optional = true }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"], optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["resource"] }
signal-hook = { version = "0.4.6", default-features = false, features = ["iterator"], optional = true }

[dev-dependencies]
nix = { version = "0.31.3", features = ["fs", "signal"] }
tempfile = "3.27.0"
